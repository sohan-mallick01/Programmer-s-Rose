<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programmer's Rose</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Dedication Text Overlay -->
  <div class="message-box" id="messageBox">
    <h1 class="title">For You 🌷</h1>
    <p class="subtitle line-1" id="typeLine1"></p>
    <p class="subtitle line-2" id="typeLine2"></p>
  </div>

  <!-- Stage 1: Golden Arch Ring -->
  <div class="golden-ring" id="goldenRing"></div>

  <!-- Ambient Rose Glow Burst -->
  <div class="ambient-glow" id="ambientGlow"></div>

  <!-- Main Flower Scene (Side/Perspective View) -->
  <div class="flower-stage">
    
    <!-- Rose Flower Head (Vertical Cup Construction) -->
    <div class="rose-head" id="roseHead">
      <!-- Back Wall Petals -->
      <div class="petal petal-back petal-back-left"></div>
      <div class="petal petal-back petal-back-center"></div>
      <div class="petal petal-back petal-back-right"></div>

      <!-- Mid Wrapping Layers -->
      <div class="petal petal-mid petal-mid-left"></div>
      <div class="petal petal-mid petal-mid-right"></div>

      <!-- Inner Core / Bud Swirl -->
      <div class="inner-bud">
        <div class="bud-swirl swirl-1"></div>
        <div class="bud-swirl swirl-2"></div>
      </div>

      <!-- Front Overlapping Curled Petals (Gives 3D depth) -->
      <div class="petal petal-front petal-front-left"></div>
      <div class="petal petal-front petal-front-right"></div>
      <div class="petal petal-front petal-front-center"></div>

      <!-- Calyx Base Cup (Neeche ka green cup) -->
      <div class="calyx-base"></div>
    </div>

    <!-- Green Sepals (Leaves right under the cup) -->
    <div class="sepals-group" id="sepalsGroup">
      <div class="sepal sepal-left"></div>
      <div class="sepal sepal-mid"></div>
      <div class="sepal sepal-right"></div>
    </div>

    <!-- Stem & Leaves -->
    <div class="stem" id="stem">
      <div class="stem-leaf leaf-left"></div>
      <div class="stem-leaf leaf-right"></div>
      <div class="thorn thorn-1"></div>
      <div class="thorn thorn-2"></div>
    </div>

  </div>

  <!-- Sparkles Container -->
  <div class="sparkles-container" id="sparkles"></div>

  <script src="script.js"></script>
</body>
</html>
